plugins {
    id 'com.android.application'
}

android {
    namespace 'com.brendigo.skypeep'
    compileSdk 36
    defaultConfig {
        applicationId 'com.brendigo.skypeep'
        minSdk 24
        targetSdk 36
        versionCode 52
        versionName '0.3.40'
    }
    sourceSets.main {
        manifest.srcFile 'AndroidManifest.xml'
        // AGP 9 built-in Kotlin reads the Kotlin source set, not java.srcDirs.
        kotlin.srcDirs = ['src/com']
        // Original icon art remains intact; generated resources contain the
        // larger branded aviator icon and correctly masked adaptive layers.
        res.srcDirs = ["$buildDir/generated/skypeep-res"]
        assets.srcDirs = ["$buildDir/generated/skypeep-assets"]
        jniLibs.srcDirs = ["$buildDir/generated/skypeep-jniLibs"]
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations {
    skyPeepNativeArchives
}

dependencies {
    skyPeepNativeArchives 'com.badlogicgames.gdx:gdx-platform:1.14.0:natives-armeabi-v7a'
    skyPeepNativeArchives 'com.badlogicgames.gdx:gdx-platform:1.14.0:natives-arm64-v8a'
    skyPeepNativeArchives 'com.badlogicgames.gdx:gdx-platform:1.14.0:natives-x86'
    skyPeepNativeArchives 'com.badlogicgames.gdx:gdx-platform:1.14.0:natives-x86_64'
    testImplementation 'junit:junit:4.13.2'
    implementation 'com.badlogicgames.gdx:gdx:1.14.0'
    implementation 'com.badlogicgames.gdx:gdx-backend-android:1.14.0'
    runtimeOnly 'com.badlogicgames.gdx:gdx-platform:1.14.0:natives-armeabi-v7a'
    runtimeOnly 'com.badlogicgames.gdx:gdx-platform:1.14.0:natives-arm64-v8a'
    runtimeOnly 'com.badlogicgames.gdx:gdx-platform:1.14.0:natives-x86'
    runtimeOnly 'com.badlogicgames.gdx:gdx-platform:1.14.0:natives-x86_64'
}

// Assets are stored as immutable chunks to preserve the user's exact source artwork in GitHub.
// Reassembly and SHA-256 verification are performed automatically before Android builds.
def artParts = fileTree(dir: "$rootDir/assets/pack", include: 'part-*')
tasks.register('restoreSkyPeepArtwork') {
    inputs.files(artParts)
    inputs.file(file("$rootDir/tools/RebuildWorlds.java"))
    // The original supplied Gameplay painting is the canonical Sun Peak
    // source, rather than the old source package's previously banded bg_6.
    inputs.file(file("$rootDir/assets/previews/gameplay.jpg"))
    outputs.dir(layout.buildDirectory.dir('generated/skypeep-assets'))
    doLast {
        def ordered = artParts.files.sort { it.name }
        if (ordered.size() != 24) throw new GradleException('Missing SkyPeep artwork chunks')
        def artZip = file("$buildDir/skypeep-art.zip")
        artZip.parentFile.mkdirs()
        artZip.withOutputStream { output ->
            ordered.each { part ->
                part.withInputStream { input ->
                    byte[] buffer = new byte[32768]
                    int count
                    while ((count = input.read(buffer)) != -1) output.write(buffer, 0, count)
                }
            }
        }
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(artZip.bytes)
        def actual = digest.collect { String.format('%02x', it & 0xff) }.join('')
        if (actual != 'e9797d4f9395b0e1d84c03f5c142875ec73d2415620c598e511a5b330bdb8624') {
            throw new GradleException('SkyPeep artwork SHA-256 verification failed: ' + actual)
        }
        copy {
            from zipTree(artZip)
            into file("$buildDir/generated/skypeep-assets")
        }
        // Source art is immutable and hash-checked. The in-game backgrounds
        // are rebuilt from these assets to erase fixed bird/pillars/HUD ghosts.
        def outputAssets = file("$buildDir/generated/skypeep-assets")
        // Gradle 9 removed Project.exec. Run the original source-art tool
        // at task execution time without shell interpolation.
        def rebuild = new ProcessBuilder(
            'java', '-Djava.awt.headless=true',
            file("$rootDir/tools/RebuildWorlds.java").absolutePath,
            outputAssets.absolutePath,
            file("$rootDir/assets/previews/gameplay.jpg").absolutePath
        ).directory(rootDir).inheritIO().start()
        if (rebuild.waitFor() != 0)
            throw new GradleException('SkyPeep source-art rebuild failed')
    }
}
tasks.named('preBuild').configure { dependsOn('restoreSkyPeepArtwork') }

// Build the launcher images from the EXISTING original SkyPeep bird icon.
// Other resources are copied unchanged, preserving application labels.
tasks.register('generateSkyPeepAppIcons') {
    inputs.dir(file('res'))
    inputs.file(file("$rootDir/tools/ImproveSkyPeepIcons.java"))
    outputs.dir(layout.buildDirectory.dir('generated/skypeep-res'))
    doLast {
        def destination = file("$buildDir/generated/skypeep-res")
        delete(destination)
        copy {
            from file('res')
            into destination
        }
        def icons = new ProcessBuilder(
            'java', '-Djava.awt.headless=true',
            file("$rootDir/tools/ImproveSkyPeepIcons.java").absolutePath,
            file('res').absolutePath, destination.absolutePath
        ).directory(rootDir).inheritIO().start()
        if (icons.waitFor() != 0)
            throw new GradleException('SkyPeep icon generation failed')
        ['mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192].each { density, size ->
            def path = file("$destination/mipmap-$density/ic_launcher.png")
            if (!path.isFile() || path.length() < 100)
                throw new GradleException("Missing generated SkyPeep icon: $density")
        }
        if (!file("$destination/mipmap-anydpi-v26/ic_launcher.xml").isFile())
            throw new GradleException('Adaptive launcher icon not generated')
    }
}
tasks.named('preBuild').configure { dependsOn('generateSkyPeepAppIcons') }
tasks.matching {
    it.name.startsWith('merge') && it.name.endsWith('Resources')
}.configureEach { dependsOn('generateSkyPeepAppIcons') }

// Android Gradle Plugin does not automatically unpack root-level .so files
// from the platform's classifier JARs just because they are runtime dependencies.
// Stage the actual libgdx.so for every ABI under jniLibs so the app can boot.
tasks.register('stageSkyPeepNatives') {
    inputs.files(configurations.skyPeepNativeArchives)
    outputs.dir(layout.buildDirectory.dir('generated/skypeep-jniLibs'))
    doLast {
        def abis = ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64']
        def directory = file("$buildDir/generated/skypeep-jniLibs")
        directory.mkdirs()
        abis.each { abi ->
            def source = configurations.skyPeepNativeArchives.files.find {
                it.name.contains("natives-$abi")
            }
            if (source == null) throw new GradleException("Missing libGDX native dependency: $abi")
            def destination = file("$directory/$abi")
            destination.mkdirs()
            copy {
                from zipTree(source)
                include '*.so'
                into destination
            }
            if (!file("$destination/libgdx.so").isFile()) {
                throw new GradleException("Native libgdx.so missing after unpack for $abi")
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn('stageSkyPeepNatives') }
tasks.matching {
    it.name.startsWith('merge') && it.name.endsWith('JniLibFolders')
}.configureEach { dependsOn('stageSkyPeepNatives') }
