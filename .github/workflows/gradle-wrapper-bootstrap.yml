name: Bootstrap official Gradle 9.6 wrapper

# One-time, branch-restricted migration job. Creates wrapper files with the
# official Gradle distribution instead of checking in an unverified binary.
on:
  push:
    branches: ['fix/skypeep-android16-gradle95']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    if: github.repository == 'bren-wp/SkyPeep' && github.ref == 'refs/heads/fix/skypeep-android16-gradle95'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Generate wrapper from isolated Gradle 9.6 project
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/skypeep-wrapper-bootstrap"
          mkdir -p "$scratch"
          printf "rootProject.name = 'wrapper-bootstrap'\n" > "$scratch/settings.gradle"
          (
            cd "$scratch"
            gradle wrapper --gradle-version 9.6.0 --distribution-type bin
            gradle wrapper --gradle-version 9.6.0 --distribution-type bin
          )
          test -s "$scratch/gradle/wrapper/gradle-wrapper.jar"
          grep -q 'gradle-9.6.0-bin.zip' "$scratch/gradle/wrapper/gradle-wrapper.properties"
          cp "$scratch/gradlew" "$scratch/gradlew.bat" .
          mkdir -p gradle/wrapper
          cp "$scratch/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/
          cp "$scratch/gradle/wrapper/gradle-wrapper.properties" gradle/wrapper/
          chmod +x gradlew
          sha256sum gradle/wrapper/gradle-wrapper.jar
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if ! git diff --cached --quiet; then
            git commit -m 'build: commit official Gradle 9.6 wrapper'
            # Safe fast-forward-only update: refuse to rewrite other work.
            git push origin "HEAD:$GITHUB_REF_NAME"
          else
            echo 'Official Gradle 9.6 wrapper already committed'
          fi
